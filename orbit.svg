<svg viewBox="0 0 500 500" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --bg-color: transparent;
      --orbit-line-color: rgba(167, 139, 250, 0.15);
      --center-glow: rgba(124, 58, 237, 0.4);
      --star-color: rgba(255, 255, 255, 0.2);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --orbit-line-color: rgba(79, 70, 229, 0.12);
        --center-glow: rgba(79, 70, 229, 0.25);
        --star-color: rgba(0, 0, 0, 0.1);
      }
    }
    .orbit-path {
      fill: none;
      stroke: var(--orbit-line-color);
      stroke-width: 1.5;
      stroke-dasharray: 6 6;
    }
    .orbit-path-glow {
      fill: none;
      stroke: var(--orbit-line-color);
      stroke-width: 6;
      opacity: 0.3;
      filter: blur(2px);
    }
    .center-glow-circle {
      fill: var(--center-glow);
      filter: blur(12px);
      animation: pulse-glow 4s ease-in-out infinite alternate;
    }
    .star {
      fill: var(--star-color);
    }
    @keyframes pulse-glow {
      0% { r: 35; opacity: 0.6; }
      100% { r: 50; opacity: 0.9; }
    }
    .tech-icon-container {
      cursor: pointer;
    }
    .icon-bg {
      fill: #0d1117;
      stroke: rgba(255, 255, 255, 0.1);
      stroke-width: 1.5;
      transition: all 0.3s ease;
    }
    @media (prefers-color-scheme: light) {
      .icon-bg {
        fill: #ffffff;
        stroke: rgba(0, 0, 0, 0.1);
      }
    }
    .tech-icon-container:hover .icon-bg {
      fill: #161b22;
      stroke: #a78bfa;
      transform: scale(1.15);
    }
    @media (prefers-color-scheme: light) {
      .tech-icon-container:hover .icon-bg {
        fill: #f3f4f6;
        stroke: #4f46e5;
      }
    }
  </style>

  <!-- Background Stars/Dots -->
  <circle cx="100" cy="80" r="1.5" class="star" />
  <circle cx="420" cy="120" r="1" class="star" />
  <circle cx="80" cy="380" r="2" class="star" />
  <circle cx="390" cy="400" r="1.5" class="star" />
  <circle cx="250" cy="50" r="1" class="star" />
  <circle cx="450" cy="280" r="2" class="star" />
  <circle cx="50" cy="220" r="1" class="star" />

  <!-- Orbit Path Lines -->
  <circle cx="250" cy="250" r="160" class="orbit-path-glow" />
  <circle cx="250" cy="250" r="160" class="orbit-path" />

  <!-- Center Glowing Node -->
  <circle cx="250" cy="250" r="40" class="center-glow-circle" />
  <defs>
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>
  <circle cx="250" cy="250" r="32" fill="url(#centerGrad)" />
  
